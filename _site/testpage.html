<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon/favicon-32x32.png">

    <noscript>
      <style>
        .require-js {
            display: none;
        }
      </style>
    </noscript>
    <script data-goatcounter="https://scottwa.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <style>
      .fixed-top-button {
          position: fixed;
          top: 20px;
          right: 20px;
          z-index: 1000;

          padding: 0px 0px;
          background-color: rgba(0, 0, 0, 0);
          border: none;
          border-radius: 0;
          cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="light-dark-button" class="require-js fixed-top-button"></button>
    <script defer>
      const schemes = ['light dark', 'dark', 'light'];
      const schemeIcons = ['🌓', '🌙', '☀️'];

      const metaTag = document.querySelector('[name="color-scheme"]');
      const lightDarkButton = document.getElementById('light-dark-button');
      const savedScheme = localStorage.getItem("colorScheme") ?? schemes[0];

      let schemeIndex = schemes.indexOf(savedScheme);
      schemeIndex = schemeIndex >= 0 ? schemeIndex : 0;
      const setScheme = (schIdx) => {
          metaTag.setAttribute('content', schemes[schIdx]);
          lightDarkButton.innerText = schemeIcons[schIdx];
      };

      setScheme(schemeIndex);

      lightDarkButton.addEventListener('click', function () {
          schemeIndex = (schemeIndex + 1) % schemes.length
          setScheme(schemeIndex);
          localStorage.setItem("colorScheme", schemes[schemeIndex]);
      });
    </script>
    <main class="h-entry">
      <h1 class="p-name">Test page</h1>
