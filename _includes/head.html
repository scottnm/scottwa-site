<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="/styles.css">
    {% include icon.html %}
    {% if page.title %}
    <title>scottwa.xyz: {{page.title}}</title>
    {% else %}
    <title>scottwa.xyz</title>
    {% endif %}
    <noscript>
        <style>
            .require-js {
                display: none;
            }
        </style>
    </noscript>
    <script data-goatcounter="https://scottwa.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <style>
        .fixed-top-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;

            padding: 0px 0px;
            background-color: rgba(0, 0, 0, 0);
            border: none;
            border-radius: 0;
            cursor: pointer;
        }
    </style>
</head>
