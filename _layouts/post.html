<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>
    {% include page-header.html %}
    <main class="h-entry">
        {% if page.title %}
        <h1 class="p-name">{{page.title}}</h1>
        <span style="font-style: italic"><time class="dt-published" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{page.date | date: "%Y-%m-%d"}}</time></span>
        {% endif %}
        <article class="e-content">
            {{ content }}
        </article>
    </main>
    {% include page-footer.html %}
</body>

</html>
